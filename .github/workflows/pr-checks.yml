name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    # Push triggers the tests as well. The push
    # trigger preserves the repo's prior behavior of running tests on
    # main pushes too.
    paths-ignore:
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.action != 'closed'
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/python-test.yml@v9
    with:
      runner: arc-df-device-activity-telegram-bot
      run-mypy: true
      # The shared workflow defaults mypy-paths to "src/", which left the test
      # suite unchecked while ruff and pytest both covered it (#59).
      mypy-paths: "src/ tests/"

